name: Diagnose Fabric networking signatures
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon --console=plain >/dev/null 2>&1 || true
      - name: javap networking API
        run: |
          OUT=/tmp/net_diag.txt
          : > "$OUT"
          FOUND=0
          while IFS= read -r j; do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/fabricmc/fabric/api/networking/v1/ServerPlayNetworking.class'; then
              FOUND=1
              echo "=== JAR $j ===" >> "$OUT"
              for C in \
                'net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking' \
                'net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking$PlayChannelHandler' \
                'net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking' \
                'net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking$PlayChannelHandler' \
                'net.fabricmc.fabric.api.networking.v1.PacketSender' \
                'net.fabricmc.fabric.api.event.player.UseBlockCallback' ; do
                echo "--- $C ---" >> "$OUT"
                javap -p -classpath "$j" "$C" >> "$OUT" 2>&1
              done
              break
            fi
          done < <(find . "$HOME/.gradle" -name '*.jar' 2>/dev/null)
          echo "FOUND=$FOUND" >> "$OUT"
          cat "$OUT"
          python3 - <<'PY'
          import base64,json,urllib.request,os
          data=open('/tmp/net_diag.txt','rb').read()
          body=json.dumps({"message":"Networking signature diagnostic [skip ci]",
                           "content":base64.b64encode(data).decode(),
                           "branch":"main"}).encode()
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/ci-out/net-signatures.txt"
          tok=os.environ['GH_TOKEN']
          # try update if exists
          try:
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','User-Agent':'sr'})
              cur=json.loads(urllib.request.urlopen(req,timeout=60).read())
              body=json.dumps({"message":"Networking signature diagnostic [skip ci]",
                               "content":base64.b64encode(data).decode(),
                               "branch":"main","sha":cur['sha']}).encode()
          except Exception as e: print('new file',e)
          req=urllib.request.Request(url,data=body,method='PUT',
              headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json',
                       'User-Agent':'sr','Content-Type':'application/json'})
          print('PUT',urllib.request.urlopen(req,timeout=90).status)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
