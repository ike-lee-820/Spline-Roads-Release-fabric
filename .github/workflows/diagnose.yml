name: Diagnose Mixin lambda names
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare remapped Minecraft jar
        run: chmod +x gradlew && ./gradlew compileJava --no-daemon --console=plain >/dev/null 2>&1 || true
      - name: Print chunk render class members
        run: |
          OUT=/tmp/sr_diag.txt
          JAR=""
          while IFS= read -r j; do
            if unzip -l "$j" 2>/dev/null | grep -q 'ChunkRenderDispatcher\$RenderChunk\$RebuildTask.class'; then JAR="$j"; break; fi
          done < <(find . "$HOME/.gradle" -name '*.jar' 2>/dev/null)
          echo "SR_DIAG_JAR=$JAR" | tee "$OUT"
          if [ -n "$JAR" ]; then
            echo "=== RebuildTask ===" >> "$OUT"
            javap -p -classpath "$JAR" 'net.minecraft.client.renderer.chunk.ChunkRenderDispatcher$RenderChunk$RebuildTask' >> "$OUT" 2>&1
            echo "=== RenderChunk ===" >> "$OUT"
            javap -p -classpath "$JAR" 'net.minecraft.client.renderer.chunk.ChunkRenderDispatcher$RenderChunk' >> "$OUT" 2>&1
            echo "=== Dispatcher ===" >> "$OUT"
            javap -p -classpath "$JAR" 'net.minecraft.client.renderer.chunk.ChunkRenderDispatcher' >> "$OUT" 2>&1
          fi
          cat "$OUT"
          mkdir -p ci-out
          cp "$OUT" ci-out/lambda-names.txt
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ci-out/lambda-names.txt
          git commit -m "Lambda diagnostic output [skip ci]" || true
          git push
